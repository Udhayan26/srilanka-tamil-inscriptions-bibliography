name: Weekly bibliography update

on:
  schedule:
    # Every Monday 02:17 UTC (07:47 Sri Lanka / India time)
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these sources (comma-separated: news,ezhuna,noolaham,openalex,crossref). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect new items
        run: python scraper/collect.py --only "${{ github.event.inputs.only }}"

      - name: Rebuild Excel and CSV
        run: python scripts/build_excel.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No new items this week."
          else
            git commit -m "Weekly update: $(date -u +%Y-%m-%d)"
            git push
          fi
